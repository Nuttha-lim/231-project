name: Java build

on:
  push:
    branches: [main, 'portfolio/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore bundled assets and compile
        shell: powershell
        run: ./scripts/run.ps1 -BuildOnly
